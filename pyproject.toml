# ============================================================================
# pyproject.toml —— 项目工程化配置（构建 + 代码质量 + 测试）
#
# 【本文件是干什么的】
#   这是 Python 项目的"工程化总控"文件，集中管理三类配置：
#     1. [build-system]  构建后端（用 setuptools 打包）
#     2. [tool.ruff]     代码风格检查 + 自动修复（ruff，替代 flake8/black/isort）
#     3. [tool.mypy]     静态类型检查（mypy，配合类型注解）
#     4. [tool.pytest]   测试配置（pytest）
#   有了它，一条命令就能跑"格式检查、类型检查、测试"全套，是 CI 的基础。
#
# 【为什么用 ruff】
#   ruff 是这两年最快的 Python linter/formatter（Rust 写的），一个工具
#   同时替代 flake8（风格）、black（格式化）、isort（import 排序）。
#   速度快、配置少，是新项目的业界主流选择。
# ============================================================================

# ----------------------------------------------------------------------------
# 构建系统
# ----------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


# ----------------------------------------------------------------------------
# 项目元信息
# ----------------------------------------------------------------------------
[project]
name = "rag-from-llm-ai"
version = "0.1.0"
description = "模块化 RAG 平台：从零手写底层，不依赖 LangChain/LlamaIndex"
requires-python = ">=3.12"

# 声明源码布局：src 布局（代码在 src/ 下，避免意外导入未安装的包）
[tool.setuptools.packages.find]
where = ["src"]


# ----------------------------------------------------------------------------
# ruff：代码风格检查 + 格式化
# ----------------------------------------------------------------------------
[tool.ruff]
# 目标 Python 版本
target-version = "py312"
# 源码目录
src = ["src", "tests"]
# 单行最大长度（与 PEP8 一致，但放宽到 100，避免中文注释频繁换行）
line-length = 100

[tool.ruff.lint]
# 启用的规则集（选择主流、够用的子集）：
#   E/W  pycodestyle 基础风格（空白、行尾等）
#   F    pyflakes（未使用导入、未定义变量等）
#   I    isort（import 排序）
#   UP   pyupgrade（用更新的语法，如 f-string）
#   B    bugbear（常见 bug 模式）
#   N    pep8-naming（命名规范）
select = ["E", "W", "F", "I", "UP", "B", "N"]

# 忽略的规则（本项目特定豁免，含原因）：
#   E501  行太长（中文注释易超，且已放宽 line-length，仍留豁免）
#   N802  函数名大写（settings 类字段名全大写是约定，豁免）
#   N806  变量名大写（同上，配置项全大写）
ignore = ["E501", "N802", "N806"]


# ----------------------------------------------------------------------------
# mypy：静态类型检查
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# 严格模式（企业级推荐：能挡掉大多数类型错误）
strict = false
# 缺少类型注解的函数不报错（本项目注释教学为主，不强求全注解）
disallow_untyped_defs = false
# 忽略第三方库缺少类型存根（requests、faiss 等可能无 stub）
ignore_missing_imports = true


# ----------------------------------------------------------------------------
# pytest：测试配置
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
# 测试文件匹配规则
python_files = ["test_*.py"]
# 测试根目录
testpaths = ["tests"]
# 注册自定义标记（消除警告）
markers = [
    "integration: 依赖外部服务（如 Ollama）的集成测试",
]
